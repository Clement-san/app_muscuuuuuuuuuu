<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="theme-color" content="#f3f0e9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Muscu</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="main"></main>

<!-- Minuteur de repos (affiché seulement quand il est actif) -->
<div id="timer" hidden>
  <div class="lbl"><div id="tt">0:00</div><div class="mut sm" id="tl"></div></div>
  <button data-act="tm" data-d="-15">−15 s</button>
  <button data-act="tm" data-d="15">+15 s</button>
  <button data-act="trestart" aria-label="Relancer le repos">↻</button>
  <button data-act="tstop" aria-label="Arrêter le minuteur"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  <div id="bar"></div>
</div>

<nav id="tabs">
  <button data-tab="seance" aria-label="Séance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8v8M4 9.5v5M17.5 8v8M20 9.5v5M6.5 12h11M2.5 10v4M21.5 10v4"/></svg><span>Séance</span></button>
  <button data-tab="plan" aria-label="Plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg><span>Plan</span></button>
  <button data-tab="catalogue" aria-label="Catalogue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20M8 7h8M8 10h8"/></svg><span>Catalogue</span></button>
  <button data-tab="prog" aria-label="Données"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M8 17h5"/></svg><span>Données</span></button>
  <button data-tab="hist" aria-label="Progrès"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17M7 15l4-4 3 2 6-7"/><path d="M16 6h4v4"/></svg><span>Progrès</span></button>
  <button data-tab="reg" aria-label="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.1.9-1.1 1.9-1.4-.5-.2.1a8 8 0 0 1-1.3.8l-.2.1-.2 1.5h-2.2l-.3-1.5-.2-.1a8 8 0 0 1-1.3-.8l-.2-.1-1.4.5-1.1-1.9 1.1-.9.1-.2a7 7 0 0 1 0-1.6l-.1-.2-1.1-.9 1.1-1.9 1.4.5.2-.1a8 8 0 0 1 1.3-.8l.2-.1.3-1.5h2.2l.2 1.5.2.1a8 8 0 0 1 1.3.8l.2.1 1.4-.5 1.1 1.9-1.1.9-.1.2a7 7 0 0 1 0 1.6Z"/></svg><span>Réglages</span></button>
</nav>
<div id="toast"></div>

<script src="js/core.js"></script><script src="js/views.js"></script><script src="js/progress.js"></script><script src="js/plan.js"></script><script src="js/timer.js"></script><script src="js/actions.js"></script><script src="js/events.js"></script>
</body>
</html>
